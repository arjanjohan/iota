syntax = "proto3";

package iota.types;

// Flag use to disambiguate the signature schemes supported by IOTA.
//
// Note: the enum values defined by this proto message exactly match their
// expected BCS serialized values when serialized as a u8. See
// [enum.SignatureScheme](https://github.com/iotaledger/sui-rust-sdk/iota_sdk_types/enum.SignatureScheme.html)
// for more information about signature schemes.
enum SignatureScheme {
  ED25519 = 0;
  SECP256K1 = 1;
  SECP256R1 = 2;
  MULTISIG = 3;
  BLS12381 = 4;
  ZKLOGIN = 5;
  PASSKEY = 6;
}
