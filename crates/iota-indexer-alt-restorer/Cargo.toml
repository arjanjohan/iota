[package]
name = "iota-indexer-alt-restorer"
version = "0.1.0"
authors = ["IOTA Foundation <info@iota.org>"]
license = "Apache-2.0"
publish = false
edition = "2021"

[dependencies]
anyhow = { version = "1.0.71", features = ["backtrace"] }
async-trait = "0.1.68"
clap = { version = "4.3.0", features = ["derive", "env"] }
futures = "0.3.28"
tracing = "0.1.37"

diesel = { workspace = true, features = ["chrono"] }
diesel-async = { workspace = true, features = ["bb8", "postgres", "async-connection-wrapper"] }
indicatif.workspace = true
object_store.workspace = true
prometheus.workspace = true
iota-archival.workspace = true
iota-config.workspace = true
iota-core.workspace = true
iota-field-count.workspace = true
iota-indexer-alt-schema.workspace = true
iota-indexer-alt-framework.workspace = true
iota-pg-db.workspace = true
iota-snapshot.workspace = true
iota-storage.workspace = true
iota-types.workspace = true
tokio = { workspace = true, features = ["full"] }
telemetry-subscribers.workspace = true

[[bin]]
name = "iota-indexer-alt-restorer"
path = "src/main.rs"

